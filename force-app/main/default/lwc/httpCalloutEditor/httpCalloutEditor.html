<template>
    <!-- HTTP Method -->
    <div class="slds-m-bottom_small">
        <lightning-combobox
            name="httpMethod"
            label="HTTP Method"
            value={httpMethod}
            options={httpMethodOptions}
            onchange={handleHttpMethodChange}
            required
        ></lightning-combobox>
    </div>

    <!-- Named Credential Name -->
    <div class="slds-m-bottom_small">
        <div class="resource-field-label">
            <span class="slds-form-element__label">Named Credential Name</span>
            <lightning-button-icon
                icon-name={namedCredentialNameToggleIcon}
                data-field="namedCredentialName"
                onclick={toggleFieldMode}
                alternative-text="Toggle resource"
                variant="bare"
                size="x-small"
                class="resource-toggle-btn"
            ></lightning-button-icon>
        </div>
        <template if:false={namedCredentialNameIsResource}>
            <lightning-input
                variant="label-hidden"
                type="text"
                value={namedCredentialName}
                data-field="namedCredentialName"
                onchange={handleFieldLiteral}
                placeholder="e.g., My_API"
            ></lightning-input>
        </template>
        <template if:true={namedCredentialNameIsResource}>
            <lightning-combobox
                variant="label-hidden"
                value={namedCredentialName}
                options={stringResourceOptions}
                data-field="namedCredentialName"
                onchange={handleFieldResource}
                placeholder="Select a resource..."
            ></lightning-combobox>
        </template>
    </div>

    <!-- Endpoint URL -->
    <div class="slds-m-bottom_small">
        <div class="resource-field-label">
            <span class="slds-form-element__label">Endpoint URL</span>
            <lightning-button-icon
                icon-name={endpointUrlToggleIcon}
                data-field="endpointUrl"
                onclick={toggleFieldMode}
                alternative-text="Toggle resource"
                variant="bare"
                size="x-small"
                class="resource-toggle-btn"
            ></lightning-button-icon>
        </div>
        <template if:false={endpointUrlIsResource}>
            <lightning-input
                variant="label-hidden"
                type="text"
                value={endpointUrl}
                data-field="endpointUrl"
                onchange={handleFieldLiteral}
                placeholder="e.g., https://api.example.com"
            ></lightning-input>
        </template>
        <template if:true={endpointUrlIsResource}>
            <lightning-combobox
                variant="label-hidden"
                value={endpointUrl}
                options={stringResourceOptions}
                data-field="endpointUrl"
                onchange={handleFieldResource}
                placeholder="Select a resource..."
            ></lightning-combobox>
        </template>
    </div>

    <!-- Path -->
    <div class="slds-m-bottom_small">
        <div class="resource-field-label">
            <span class="slds-form-element__label">Path</span>
            <lightning-button-icon
                icon-name={pathToggleIcon}
                data-field="path"
                onclick={toggleFieldMode}
                alternative-text="Toggle resource"
                variant="bare"
                size="x-small"
                class="resource-toggle-btn"
            ></lightning-button-icon>
        </div>
        <template if:false={pathIsResource}>
            <lightning-input
                variant="label-hidden"
                type="text"
                value={path}
                data-field="path"
                onchange={handleFieldLiteral}
                placeholder="e.g., /api/v1/users"
            ></lightning-input>
        </template>
        <template if:true={pathIsResource}>
            <lightning-combobox
                variant="label-hidden"
                value={path}
                options={stringResourceOptions}
                data-field="path"
                onchange={handleFieldResource}
                placeholder="Select a resource..."
            ></lightning-combobox>
        </template>
    </div>

    <!-- Body (conditional) -->
    <template if:true={showBodyField}>
        <div class="slds-m-bottom_small">
            <div class="resource-field-label">
                <span class="slds-form-element__label">Body</span>
                <lightning-button-icon
                    icon-name={bodyToggleIcon}
                    data-field="body"
                    onclick={toggleFieldMode}
                    alternative-text="Toggle resource"
                    variant="bare"
                    size="x-small"
                    class="resource-toggle-btn"
                ></lightning-button-icon>
            </div>
            <template if:false={bodyIsResource}>
                <lightning-textarea
                    variant="label-hidden"
                    value={body}
                    data-field="body"
                    onchange={handleFieldLiteral}
                    placeholder='e.g., {"name": "Test"}'
                ></lightning-textarea>
            </template>
            <template if:true={bodyIsResource}>
                <lightning-combobox
                    variant="label-hidden"
                    value={body}
                    options={stringResourceOptions}
                    data-field="body"
                    onchange={handleFieldResource}
                    placeholder="Select a resource..."
                ></lightning-combobox>
            </template>
        </div>
    </template>

    <!-- Timeout -->
    <div class="slds-m-bottom_small">
        <div class="resource-field-label">
            <span class="slds-form-element__label">Timeout (ms)</span>
            <lightning-button-icon
                icon-name={timeoutToggleIcon}
                data-field="timeout"
                onclick={toggleFieldMode}
                alternative-text="Toggle resource"
                variant="bare"
                size="x-small"
                class="resource-toggle-btn"
            ></lightning-button-icon>
        </div>
        <template if:false={timeoutIsResource}>
            <lightning-input
                variant="label-hidden"
                type="number"
                value={timeout}
                data-field="timeout"
                onchange={handleFieldLiteral}
                placeholder="30000"
                min="1"
                max="120000"
            ></lightning-input>
        </template>
        <template if:true={timeoutIsResource}>
            <lightning-combobox
                variant="label-hidden"
                value={timeout}
                options={numberResourceOptions}
                data-field="timeout"
                onchange={handleFieldResource}
                placeholder="Select a resource..."
            ></lightning-combobox>
        </template>
    </div>

    <!-- ── Headers Section ──────────────────────────────────────── -->
    <div class="slds-m-top_medium slds-m-bottom_small">
        <div class="section-header">
            <h3 class="slds-text-heading_small">Headers</h3>
            <lightning-button
                label="Add Header"
                icon-name="utility:add"
                onclick={handleAddHeader}
                variant="neutral"
            ></lightning-button>
        </div>

        <template if:true={hasHeaders}>
            <div class="column-labels slds-m-top_x-small">
                <span class="slds-text-body_small slds-text-color_weak label-key">Key</span>
                <span class="slds-text-body_small slds-text-color_weak label-value">Value</span>
                <span class="remove-placeholder"></span>
            </div>

            <template for:each={headers} for:item="header">
                <div key={header.id} class="key-value-row slds-m-top_xx-small">
                    <lightning-input
                        type="text"
                        label="Key"
                        value={header.key}
                        data-id={header.id}
                        onchange={handleHeaderKeyChange}
                        placeholder="e.g., Authorization"
                        variant="label-hidden"
                        class="input-key"
                    ></lightning-input>
                    <lightning-input
                        type="text"
                        label="Value"
                        value={header.value}
                        data-id={header.id}
                        onchange={handleHeaderValueChange}
                        placeholder="e.g., Bearer xyz"
                        variant="label-hidden"
                        class="input-value"
                    ></lightning-input>
                    <lightning-button-icon
                        icon-name="utility:delete"
                        alternative-text="Remove header"
                        data-id={header.id}
                        onclick={handleRemoveHeader}
                        variant="bare"
                        size="medium"
                        class="remove-btn"
                    ></lightning-button-icon>
                </div>
            </template>
        </template>

        <template if:false={hasHeaders}>
            <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                No headers. Click "Add Header" to add one.
            </p>
        </template>
    </div>

    <!-- ── Query Parameters Section ─────────────────────────────── -->
    <div class="slds-m-top_medium slds-m-bottom_small">
        <div class="section-header">
            <h3 class="slds-text-heading_small">Query Parameters</h3>
            <lightning-button
                label="Add Parameter"
                icon-name="utility:add"
                onclick={handleAddQueryParam}
                variant="neutral"
            ></lightning-button>
        </div>

        <template if:true={hasQueryParams}>
            <div class="column-labels slds-m-top_x-small">
                <span class="slds-text-body_small slds-text-color_weak label-key">Key</span>
                <span class="slds-text-body_small slds-text-color_weak label-value">Value</span>
                <span class="remove-placeholder"></span>
            </div>

            <template for:each={queryParams} for:item="param">
                <div key={param.id} class="key-value-row slds-m-top_xx-small">
                    <lightning-input
                        type="text"
                        label="Key"
                        value={param.key}
                        data-id={param.id}
                        onchange={handleParamKeyChange}
                        placeholder="e.g., status"
                        variant="label-hidden"
                        class="input-key"
                    ></lightning-input>
                    <lightning-input
                        type="text"
                        label="Value"
                        value={param.value}
                        data-id={param.id}
                        onchange={handleParamValueChange}
                        placeholder="e.g., active"
                        variant="label-hidden"
                        class="input-value"
                    ></lightning-input>
                    <lightning-button-icon
                        icon-name="utility:delete"
                        alternative-text="Remove parameter"
                        data-id={param.id}
                        onclick={handleRemoveQueryParam}
                        variant="bare"
                        size="medium"
                        class="remove-btn"
                    ></lightning-button-icon>
                </div>
            </template>
        </template>

        <template if:false={hasQueryParams}>
            <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                No query parameters. Click "Add Parameter" to add one.
            </p>
        </template>
    </div>
</template>
